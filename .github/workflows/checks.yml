name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  accounts-and-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s server -p 'test_*.py'
      - run: python tools/audit_public.py
